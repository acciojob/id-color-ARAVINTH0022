<!DOCTYPE html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling with ID Selectors</title>
    <style>
        #yellow {
            background-color: yellow;
            border-width: 1px;
            border-style: solid;
            border-color: green;
        }

        #red {
            background-color: red;
            border-width: 1px;
            border-style: solid;
            border-color: black;
        }

        #green {
            background-color: green;
            border-width: 1px;
            border-style: solid;
            border-color: yellow;
        }
    </style>
</head>
<body>

    <p id="yellow">This is the yellow paragraph.</p>
    <p id="red">This is the red paragraph.</p>
    <p id="green">This is the green paragraph.</p>

</body>
</html>
